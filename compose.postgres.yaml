name: webncrew-local

services:
  postgres:
    image: postgres:17
    container_name: webncrew-postgres
    restart: unless-stopped
    env_file:
      - .env.postgres.local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
